name: Build WaterTankMonitoring APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q WaterTankMonitoring_build_ready.zip -d project

      - name: Fix source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("project/waterproj/app/src/main/java/com/watertank/monitoring")

          p = base / "network/ApiClient.kt"
          s = p.read_text()

          s = s.replace(
              'okhttp3.RequestBody.create(okhttp3.MediaType.parse("application/json"), jsonBody)',
              'jsonBody.toRequestBody("application/json".toMediaType())'
          )

          s = s.replace(
              'okhttp3.RequestBody.create(\n                okhttp3.MediaType.parse("application/json"),\n                jsonBody\n            )',
              'jsonBody.toRequestBody("application/json".toMediaType())'
          )

          s = s.replace(
              'okhttp3.RequestBody.create(\n            okhttp3.MediaType.parse("application/json"),\n            jsonBody\n        )',
              'jsonBody.toRequestBody("application/json".toMediaType())'
          )

          s = s.replace(
              'okhttp3.MediaType.parse("application/json")',
              '"application/json".toMediaType()'
          )

          if "import okhttp3.MediaType.Companion.toMediaType" not in s:
              s = s.replace(
                  "import okhttp3.OkHttpClient",
                  "import okhttp3.MediaType.Companion.toMediaType\nimport okhttp3.OkHttpClient"
              )

          if "import okhttp3.RequestBody.Companion.toRequestBody" not in s:
              s = s.replace(
                  "import okhttp3.Request",
                  "import okhttp3.Request\nimport okhttp3.RequestBody.Companion.toRequestBody"
              )

          p.write_text(s)

          p = base / "utils/Utils.kt"
          s = p.read_text()

          s = s.replace("SignalCellular2Bar", "SignalCellularAlt")
          s = s.replace("SignalCellular1Bar", "SignalCellularAlt")
          s = s.replace("SignalCellularOff", "SignalCellularAlt")

          if "import androidx.compose.material.icons.filled.SignalCellularAlt" not in s:
              s = s.replace(
                  "import androidx.compose.ui.graphics.vector.ImageVector",
                  "import androidx.compose.ui.graphics.vector.ImageVector\nimport androidx.compose.material.icons.filled.SignalCellularAlt"
              )

          p.write_text(s)

          p = base / "MainActivity.kt"
          s = p.read_text()
          s = s.replace("BatteryCharging50", "BatteryFull")
          p.write_text(s)

          print("SOURCE FIX COMPLETE")
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd project/waterproj
          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterTankMonitoring-APK
          path: project/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
