name: Build WaterTankMonitoring APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q WaterTankMonitoring_build_ready.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd "$GITHUB_WORKSPACE/project/waterproj"
          gradle assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "APK files found:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterTankMonitoring-APK
          path: project/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
