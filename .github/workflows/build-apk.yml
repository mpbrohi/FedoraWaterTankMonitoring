
      - name: Repair Kotlin source files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path(
              "project/waterproj/app/src/main/java/"
              "com/watertank/monitoring"
          )

          # Utils.kt
          p = base / "utils" / "Utils.kt"
          s = p.read_text()

          # Replace unavailable Material icons
          s = s.replace(
              "SignalCellular2Bar",
              "SignalCellularAlt"
          )

          s = s.replace(
              "SignalCellular1Bar",
              "SignalCellularAlt"
          )

          # Remove duplicate imports if replacement created them
          lines = s.splitlines()
          result = []
          seen = set()

          for line in lines:
              if line.startswith("import "):
                  if line in seen:
                      continue
                  seen.add(line)
              result.append(line)

          s = "\n".join(result) + "\n"

          p.write_text(s)

          print("Utils.kt signal icons repaired successfully.")
          PY
